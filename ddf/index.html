<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Die drei ???">
  <meta name="theme-color" content="#09090b">
  
  <title>Die drei ??? — Hörspielarchiv</title>
  
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4f4f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 18v-6a9 9 0 0 1 18 0v6'%3E%3C/path%3E%3Cpath d='M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z'%3E%3C/path%3E%3C/svg%3E">
  <style>
    .track-item-cover {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .parts-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 85;
      display: none;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .parts-modal.active {
      display: flex;
      opacity: 1;
    }
    .parts-card {
      width: 100%;
      max-width: 640px;
      background: #141418;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px 20px calc(var(--safe-bottom) + 24px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .parts-modal.active .parts-card {
      transform: translateY(0);
    }
    @media (min-width: 640px) {
      .parts-modal {
        align-items: center;
        padding: 20px;
      }
      .parts-card {
        border-radius: var(--radius-lg);
        max-height: 75vh;
      }
    }
    .parts-scroll {
      flex: 1;
      overflow-y: auto;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <a href="../index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Übersicht</span>
      </a>
      <span class="brand-badge" id="ddfBadge">118 Folgen</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Show Header -->
    <div class="show-header">
      <img id="mainShowCover" src="cover.png" alt="Die drei ??? Cover" class="show-cover-thumb">
      <div class="show-meta">
        <h1 class="show-title" id="mainShowTitle">Die drei ???</h1>
        <p class="show-subtitle" id="mainShowDesc">
          Justus Jonas, Peter Shaw und Bob Andrews ermitteln in kniffligen Kriminalfällen rund um Rocky Beach.
        </p>
        <div class="show-stats">
          <span class="pill-tag">Archive.org Audio</span>
          <span class="pill-tag" id="ddfCountTag">118 Folgen</span>
          <a id="archiveSourceLink" href="https://archive.org/details/die-drei-fragezeichen" target="_blank" rel="noopener" class="pill-tag" style="text-decoration:none;">
            <span>Quelle öffnen ↗</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Category Selector (Hauptserie, Die dr3i, Specials) -->
    <div class="pill-bar" id="categoryBar">
      <button class="pill-btn active" data-cat="serie">Hauptserie (1–175+)</button>
      <button class="pill-btn" data-cat="dr3i">Die dr3i (1–9)</button>
      <button class="pill-btn" data-cat="specials">Specials (Sonderfolgen)</button>
    </div>

    <!-- Search Input -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="ddfSearch" class="search-input" placeholder="Folge oder Nummer suchen..." autocomplete="off">
      <button id="ddfClear" class="search-clear" aria-label="Suche löschen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Episodes List -->
    <div id="ddfList" class="track-list">
      <div class="empty-state">
        <div class="empty-title">Lade Folgen...</div>
      </div>
    </div>

  </main>

  <!-- Parts / Chapters Modal for multi-track episodes -->
  <div id="partsModal" class="parts-modal">
    <div class="parts-card">
      <div class="modal-header">
        <div>
          <h2 id="partsModalTitle" class="modal-title">Folgentitel</h2>
          <div id="partsModalSubtitle" class="hero-subtitle" style="margin-top: 4px;">Kapitelübersicht</div>
        </div>
        <button id="partsModalClose" class="modal-close" aria-label="Schließen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="partsList" class="parts-scroll">
        <!-- Rendered parts -->
      </div>
      <div class="modal-actions" style="margin-top: 16px;">
        <button id="playAllPartsBtn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>Folge von Beginn abspielen</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Floating Audio Player Bar -->
  <div id="playerBar" class="player-bar">
    <div class="progress-container">
      <span id="curTime" class="time-label">0:00</span>
      <div id="progressWrap" class="progress-bar-wrap">
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
      <span id="totalTime" class="time-label right">0:00</span>
    </div>

    <div class="player-row">
      <div class="player-track-info">
        <img src="cover.png" id="playerThumb" class="player-thumb" alt="DDF Cover">
        <div class="player-titles">
          <div id="playerTitle" class="player-cur-title">Folge auswählen</div>
          <div id="playerPart" class="player-cur-show">Die drei ??? • Archive.org</div>
        </div>
      </div>

      <div class="player-controls">
        <button id="speedBtn" class="speed-btn" title="Geschwindigkeit">1.0x</button>
        <button id="skipBackBtn" class="ctrl-btn" title="15s zurück" aria-label="15 Sekunden zurück">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button id="playPauseBtn" class="ctrl-btn play-pause" aria-label="Abspielen/Pause">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button id="skipFwdBtn" class="ctrl-btn" title="15s vor" aria-label="15 Sekunden vor">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/player-core.js"></script>
  <script>
    let datasets = {
      serie: [],
      dr3i: [],
      specials: []
    };

    let currentCategory = 'serie';
    let currentList = [];
    let filteredList = [];

    let activeEpisode = null;
    let activeQueue = [];

    const playerBar = document.getElementById('playerBar');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const playerTitle = document.getElementById('playerTitle');
    const playerPart = document.getElementById('playerPart');
    const playerThumb = document.getElementById('playerThumb');
    const curTime = document.getElementById('curTime');
    const totalTime = document.getElementById('totalTime');
    const progressFill = document.getElementById('progressFill');
    const progressWrap = document.getElementById('progressWrap');
    const speedBtn = document.getElementById('speedBtn');
    const mainShowCover = document.getElementById('mainShowCover');

    const player = new ArchivAudioPlayer({
      storageKey: 'ddf_player_progress',
      showName: 'Die drei ???',
      defaultCover: 'cover.png',
      onTrackChange: (track, index) => {
        playerBar.classList.add('active');
        playerTitle.textContent = track.episodeTitle || track.title;
        playerPart.textContent = track.partTitle || track.album || 'Die drei ???';
        if (track.cover) {
          playerThumb.src = track.cover;
        }
        highlightActiveTrack(track.id || track.url);
      },
      onPlayStateChange: (isPlaying) => {
        playIcon.style.display = isPlaying ? 'none' : 'block';
        pauseIcon.style.display = isPlaying ? 'block' : 'none';
      },
      onTimeUpdate: (current, duration) => {
        curTime.textContent = ArchivAudioPlayer.formatTime(current);
        totalTime.textContent = ArchivAudioPlayer.formatTime(duration);
        const pct = duration ? (current / duration) * 100 : 0;
        progressFill.style.width = pct + '%';
      }
    });

    async function init() {
      // 1. Load dreimetadaten.json if present
      let dreimetaMap = {};
      try {
        const dres = await fetch('dreimetadaten.json');
        if (dres.ok) {
          const dj = await dres.json();
          if (dj.serie) {
            dj.serie.forEach(m => { dreimetaMap[m.nummer] = m; });
          }
        }
      } catch (e) {
        console.warn("Konnte dreimetadaten.json nicht laden:", e);
      }

      // 1b. Load Hauptserie (118 Archive.org full episodes)
      try {
        const res = await fetch('data/episodes.json');
        if (res.ok) {
          const list = await res.json();
          datasets.serie = list.map(ep => {
            const meta = dreimetaMap[ep.num] || {};
            let coverUrl = ep.cover;
            if (!coverUrl && meta.links?.cover) {
              coverUrl = meta.links.cover.replace('http://', 'https://');
            }
            if (!coverUrl) {
              coverUrl = `https://dreimetadaten.de/data/Serie/${ep.numStr}/cover.png`;
            }
            return {
              id: `serie_${ep.num}`,
              cat: 'serie',
              num: ep.num,
              numStr: ep.numStr,
              title: ep.title || meta.titel,
              cover: coverUrl,
              author: ep.author || meta.autor || 'Die drei ???',
              url: ep.url,
              duration: ep.duration,
              size: ep.size,
              description: ep.description || meta.gesamtbeschreibung || meta.beschreibung || '',
              trackCount: 1,
              tracks: [{ num: 1, title: ep.title || meta.titel, url: ep.url }]
            };
          });
        }
      } catch (e) {
        console.warn("Konnte data/episodes.json nicht laden:", e);
      }

      // 2. Load Die dr3i from dr3imetadata.json
      try {
        const res = await fetch('data/dr3i_episodes.json');
        if (res.ok) {
          datasets.dr3i = await res.json();
        } else {
          // Fallback to local dr3imetadata.json
          const rawRes = await fetch('dr3imetadata.json');
          if (rawRes.ok) {
            const data = await rawRes.json();
            datasets.dr3i = (data.serie || []).map(d => ({
              id: d.id,
              cat: 'dr3i',
              num: d.nummer,
              numStr: `D_${d.nummer}`,
              title: d.titel,
              author: d.autor || 'DiE DR3i',
              cover: d.links?.cover || `covers/D_${d.nummer}.jpg`,
              description: d.beschreibung || '',
              trackCount: d.medien?.[0]?.tracks?.length || 1,
              tracks: d.medien?.[0]?.tracks?.map((t, idx) => ({
                num: idx + 1,
                title: t.titel,
                url: ''
              })) || []
            }));
          }
        }
      } catch (e) {
        console.warn("Konnte dr3i Metadaten nicht laden:", e);
      }

      // 3. Load Specials from specialsmetadata.json
      try {
        const res = await fetch('data/specials_episodes.json');
        if (res.ok) {
          datasets.specials = await res.json();
        } else {
          const rawRes = await fetch('specialsmetadata.json');
          if (rawRes.ok) {
            const data = await rawRes.json();
            datasets.specials = (data.serie || []).map(s => ({
              id: s.id,
              cat: 'specials',
              num: s.nummer,
              numStr: s.id,
              title: s.titel,
              author: s.autor || 'Die drei ???',
              cover: s.links?.cover || `covers/${s.id}.jpg`,
              description: s.beschreibung || '',
              trackCount: s.medien?.[0]?.tracks?.length || 1,
              tracks: s.medien?.[0]?.tracks?.map((t, idx) => ({
                num: idx + 1,
                title: t.titel,
                url: ''
              })) || []
            }));
          }
        }
      } catch (e) {
        console.warn("Konnte specials Metadaten nicht laden:", e);
      }

      switchCategory('serie');

      // Check saved progress
      const saved = player.getSavedProgress();
      if (saved && saved.track) {
        player.loadTrack(saved.index || 0, false, saved.time || 0);
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('#categoryBar .pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });

      currentList = datasets[cat] || [];
      filteredList = [...currentList];

      const badge = document.getElementById('ddfBadge');
      const countTag = document.getElementById('ddfCountTag');
      const sourceLink = document.getElementById('archiveSourceLink');

      if (cat === 'serie') {
        badge.textContent = `${currentList.length} Folgen`;
        countTag.textContent = `${currentList.length} Folgen (Archive.org)`;
        sourceLink.href = "https://archive.org/details/die-drei-fragezeichen";
        mainShowCover.src = "cover.png";
      } else if (cat === 'dr3i') {
        badge.textContent = `${currentList.length} Folgen`;
        countTag.textContent = `Die dr3i (9 Folgen)`;
        sourceLink.href = "https://archive.org/details/die-dr3i-hoerspiele-herrgemmel";
        mainShowCover.src = "covers/D_1.jpg";
      } else {
        badge.textContent = `${currentList.length} Specials`;
        countTag.textContent = `${currentList.length} Sonderfolgen`;
        sourceLink.href = "https://archive.org/details/diedreifragezeichen";
        mainShowCover.src = "covers/S_1.jpg";
      }

      renderList(filteredList);

      const searchInput = document.getElementById('ddfSearch');
      if (searchInput) searchInput.value = '';
      document.getElementById('ddfClear').classList.remove('visible');
    }

    function renderList(list) {
      const container = document.getElementById('ddfList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Keine Folgen gefunden</div>
            <div class="empty-text">Passe deinen Suchbegriff an.</div>
          </div>
        `;
        return;
      }

      list.forEach((ep) => {
        const item = document.createElement('div');
        item.className = 'track-item';
        item.dataset.id = ep.id;

        let subText = '';
        if (ep.tracks && ep.tracks.length > 1) {
          subText = `${ep.tracks.length} Kapitel/Teile`;
        } else if (ep.duration) {
          subText = `ca. ${Math.round(ep.duration / 60)} Min. • Archive.org`;
        } else {
          subText = `${ep.author || 'Die drei ???'}`;
        }

        const coverSrc = ep.cover || 'cover.png';

        item.innerHTML = `
          <img src="${coverSrc}" class="track-item-cover" alt="Cover" onerror="this.src='cover.png'">
          <div class="track-info">
            <div class="track-title">${ep.numStr ? ep.numStr + ': ' : ''}${ep.title}</div>
            <div class="track-sub">${subText}</div>
          </div>
          <div class="track-play-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
        `;

        item.onclick = () => {
          if (ep.tracks && ep.tracks.length > 1) {
            openPartsModal(ep);
          } else {
            playSingleEpisode(ep);
          }
        };

        container.appendChild(item);
      });

      if (activeEpisode) {
        highlightActiveTrack(activeEpisode.id);
      }
    }

    function highlightActiveTrack(id) {
      document.querySelectorAll('#ddfList .track-item').forEach(el => {
        el.classList.toggle('playing', el.dataset.id === id);
      });
    }

    // Modal with parts/chapters for multi-track episodes (e.g. Die dr3i)
    function openPartsModal(ep) {
      document.getElementById('partsModalTitle').textContent = `${ep.numStr}: ${ep.title}`;
      document.getElementById('partsModalSubtitle').textContent = `${ep.tracks.length} Kapitel / Teile • ${ep.author || 'DiE DR3i'}`;

      const listContainer = document.getElementById('partsList');
      listContainer.innerHTML = '';

      ep.tracks.forEach((t, idx) => {
        const pItem = document.createElement('div');
        pItem.className = 'track-item';
        pItem.innerHTML = `
          <div class="track-num">${idx + 1}</div>
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${t.url ? 'Stream verfügbar' : 'Metadaten-Kapitel'}</div>
          </div>
          <div class="track-play-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
        `;
        pItem.onclick = () => {
          closePartsModal();
          playEpisodeFromPart(ep, idx);
        };
        listContainer.appendChild(pItem);
      });

      document.getElementById('playAllPartsBtn').onclick = () => {
        closePartsModal();
        playEpisodeFromPart(ep, 0);
      };

      document.getElementById('partsModal').classList.add('active');
    }

    function closePartsModal() {
      document.getElementById('partsModal').classList.remove('active');
    }

    // Playback logic for single episode (Hauptserie)
    function playSingleEpisode(ep) {
      activeEpisode = ep;
      const track = {
        id: ep.id,
        title: ep.title,
        episodeTitle: ep.title,
        partTitle: `Folge ${ep.numStr} • ${ep.author || 'Die drei ???'}`,
        url: ep.url,
        artist: ep.author || 'Die drei ???',
        album: `Folge ${ep.numStr}`,
        cover: ep.cover || 'cover.png'
      };

      activeQueue = [track];
      player.setPlaylist(activeQueue);
      player.loadTrack(0, true);
    }

    // Playback logic for multi-track episode (Die dr3i / Specials)
    function playEpisodeFromPart(ep, partIndex = 0) {
      activeEpisode = ep;
      activeQueue = ep.tracks.map((t, idx) => ({
        id: `${ep.id}_${idx}`,
        title: t.title,
        episodeTitle: ep.title,
        partTitle: `Teil ${idx + 1}: ${t.title}`,
        url: t.url,
        artist: ep.author || 'DiE DR3i',
        album: `${ep.numStr}: ${ep.title}`,
        cover: ep.cover || 'cover.png'
      }));

      player.setPlaylist(activeQueue);
      player.loadTrack(partIndex, true);
    }

    // Tab buttons
    document.querySelectorAll('#categoryBar .pill-btn').forEach(btn => {
      btn.onclick = () => switchCategory(btn.dataset.cat);
    });

    // Player bar interactions
    document.getElementById('playPauseBtn').onclick = () => player.togglePlay();
    document.getElementById('skipBackBtn').onclick = () => player.skip(-15);
    document.getElementById('skipFwdBtn').onclick = () => player.skip(15);
    speedBtn.onclick = () => {
      const sp = player.cycleSpeed();
      speedBtn.textContent = sp.toFixed(1) + 'x';
    };

    // Scrub bar click/drag
    progressWrap.addEventListener('click', (e) => {
      const rect = progressWrap.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (player.audio.duration) {
        player.seek(pos * player.audio.duration);
      }
    });

    // Search filter
    const searchInput = document.getElementById('ddfSearch');
    const clearBtn = document.getElementById('ddfClear');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      clearBtn.classList.toggle('visible', q.length > 0);

      filteredList = currentList.filter(ep => 
        (ep.title && ep.title.toLowerCase().includes(q)) ||
        (ep.numStr && ep.numStr.toLowerCase().includes(q)) ||
        (ep.author && ep.author.toLowerCase().includes(q)) ||
        (ep.description && ep.description.toLowerCase().includes(q))
      );
      renderList(filteredList);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      filteredList = [...currentList];
      renderList(filteredList);
      searchInput.focus();
    });

    document.getElementById('partsModalClose').onclick = closePartsModal;
    document.getElementById('partsModal').onclick = (e) => {
      if (e.target === document.getElementById('partsModal')) closePartsModal();
    };

    init();
  </script>
</body>
</html>
