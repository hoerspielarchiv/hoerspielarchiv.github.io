<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALF">
  <meta name="theme-color" content="#09090b">
  
  <title>ALF — Hörspielarchiv</title>
  
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4f4f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 18v-6a9 9 0 0 1 18 0v6'%3E%3C/path%3E%3Cpath d='M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z'%3E%3C/path%3E%3C/svg%3E">
</head>
<body>

  <!-- Top Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <a href="../index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Übersicht</span>
      </a>
      <span class="brand-badge" id="alfBadge">49 Folgen</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Show Header -->
    <div class="show-header">
      <img src="cover.jpg" alt="ALF Cover" class="show-cover-thumb" onerror="this.src='https://archive.org/services/img/alf-hoerspiele'">
      <div class="show-meta">
        <h1 class="show-title">ALF</h1>
        <p class="show-subtitle">
          Der außerirdische Gordon Shumway sorgt bei Familie Tanner für Chaos, Lacher und Katzenjagden.
        </p>
        <div class="show-stats">
          <span class="pill-tag">Archive.org Stream</span>
          <span class="pill-tag" id="trackCountTag">49 Folgen</span>
          <a id="archiveDownloadLink" href="https://archive.org/details/alf-hoerspiele" target="_blank" rel="noopener" class="pill-tag" style="text-decoration:none;">
            <span>Quelle öffnen ↗</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="trackSearch" class="search-input" placeholder="Folge suchen..." autocomplete="off">
      <button id="trackClear" class="search-clear" aria-label="Suche löschen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Episode List -->
    <div id="trackList" class="track-list">
      <div class="empty-state">
        <div class="empty-title">Lade Folgen...</div>
      </div>
    </div>

  </main>

  <!-- Fixed Bottom Audio Player Bar -->
  <div id="playerBar" class="player-bar">
    <div class="progress-container">
      <span id="curTime" class="time-label">0:00</span>
      <div id="progressWrap" class="progress-bar-wrap">
        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>
      <span id="totalTime" class="time-label right">0:00</span>
    </div>

    <div class="player-row">
      <div class="player-track-info">
        <img src="cover.jpg" id="playerThumb" class="player-thumb" alt="ALF Cover">
        <div class="player-titles">
          <div id="playerTitle" class="player-cur-title">Folge auswählen</div>
          <div class="player-cur-show">ALF Hörspiele</div>
        </div>
      </div>

      <div class="player-controls">
        <button id="speedBtn" class="speed-btn" title="Geschwindigkeit">1.0x</button>
        <button id="skipBackBtn" class="ctrl-btn" title="15s zurück" aria-label="15 Sekunden zurück">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button id="playPauseBtn" class="ctrl-btn play-pause" aria-label="Abspielen/Pause">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>
        <button id="skipFwdBtn" class="ctrl-btn" title="15s vor" aria-label="15 Sekunden vor">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/player-core.js"></script>
  <script>
    let tracks = [];
    let filteredTracks = [];
    const playerBar = document.getElementById('playerBar');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const playerTitle = document.getElementById('playerTitle');
    const curTime = document.getElementById('curTime');
    const totalTime = document.getElementById('totalTime');
    const progressFill = document.getElementById('progressFill');
    const progressWrap = document.getElementById('progressWrap');
    const speedBtn = document.getElementById('speedBtn');

    const player = new ArchivAudioPlayer({
      storageKey: 'alf_player_progress',
      showName: 'ALF',
      defaultCover: 'cover.jpg',
      onTrackChange: (track, index) => {
        playerBar.classList.add('active');
        playerTitle.textContent = track.title;
        if (track.cover) {
          playerThumb.src = track.cover;
        } else {
          playerThumb.src = 'cover.jpg';
        }
        highlightActiveTrack(track.url);
      },
      onPlayStateChange: (isPlaying) => {
        playIcon.style.display = isPlaying ? 'none' : 'block';
        pauseIcon.style.display = isPlaying ? 'block' : 'none';
      },
      onTimeUpdate: (current, duration) => {
        curTime.textContent = ArchivAudioPlayer.formatTime(current);
        totalTime.textContent = ArchivAudioPlayer.formatTime(duration);
        const pct = duration ? (current / duration) * 100 : 0;
        progressFill.style.width = pct + '%';
      }
    });

    async function loadTracks() {
      try {
        const res = await fetch('data/tracks.json');
        if (res.ok) {
          tracks = await res.json();
        }
      } catch (e) {
        console.warn("Konnte data/tracks.json nicht laden, versuche Archive.org...", e);
      }

      // Fallback: Archive.org API
      if (!tracks || tracks.length === 0) {
        try {
          const res = await fetch('https://archive.org/metadata/alf-hoerspiele');
          if (res.ok) {
            const data = await res.json();
            tracks = (data.files || [])
              .filter(f => f.format === 'VBR MP3' || f.format === 'MP3')
              .map((f, idx) => ({
                title: f.title || f.name.replace('.mp3', '').replace(/_/g, ' '),
                url: `https://archive.org/download/alf-hoerspiele/${encodeURIComponent(f.name)}`,
                cover: `https://archive.org/download/alf-hoerspiele/${encodeURIComponent(f.name.replace(/\.mp3$/i, '.png'))}`,
                size: f.size || 0,
                duration: f.length ? parseFloat(f.length) : 0,
                num: idx + 1
              }));
          }
        } catch (err) {
          console.error("Archive.org Fehler:", err);
        }
      }

      document.getElementById('alfBadge').textContent = `${tracks.length} Folgen`;
      document.getElementById('trackCountTag').textContent = `${tracks.length} Folgen`;

      player.setPlaylist(tracks);
      filteredTracks = [...tracks];
      renderList(filteredTracks);

      // Check URL parameters for direct resume from history or link
      const urlParams = new URLSearchParams(window.location.search);
      const resumeUrl = urlParams.get('url');
      const resumeTime = parseFloat(urlParams.get('time')) || 0;

      if (resumeUrl) {
        const foundIdx = tracks.findIndex(t => t.url === resumeUrl);
        if (foundIdx !== -1) {
          player.loadTrack(foundIdx, true, resumeTime);
          return;
        }
      }

      // Check if user had a saved progress
      const saved = player.getSavedProgress();
      if (saved && saved.index >= 0 && saved.index < tracks.length) {
        player.loadTrack(saved.index, false, saved.time || 0);
      }
    }

    function renderList(list) {
      const container = document.getElementById('trackList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">Keine Folge gefunden</div>
            <div class="empty-text">Passe deinen Suchbegriff an.</div>
          </div>
        `;
        return;
      }

      list.forEach((t, i) => {
        const originalIndex = tracks.findIndex(x => x.url === t.url);
        const item = document.createElement('div');
        item.className = 'track-item';
        item.dataset.url = t.url;

        const sizeMb = t.size ? (t.size / (1024 * 1024)).toFixed(1) + ' MB' : 'MP3';
        const durationStr = t.duration ? ` • ca. ${Math.round(t.duration / 60)} Min.` : '';
        const coverSrc = t.cover || 'cover.jpg';

        item.innerHTML = `
          <img src="${coverSrc}" class="track-item-cover" alt="Cover" onerror="this.src='cover.jpg'">
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-sub">${sizeMb}${durationStr}</div>
          </div>
          <div class="track-play-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          </div>
        `;

        item.onclick = () => {
          player.loadTrack(originalIndex, true);
        };

        container.appendChild(item);
      });

      if (player.currentIndex >= 0 && tracks[player.currentIndex]) {
        highlightActiveTrack(tracks[player.currentIndex].url);
      }
    }

    function highlightActiveTrack(url) {
      document.querySelectorAll('.track-item').forEach(el => {
        el.classList.toggle('playing', el.dataset.url === url);
      });
    }

    // Player bar interactions
    document.getElementById('playPauseBtn').onclick = () => player.togglePlay();
    document.getElementById('skipBackBtn').onclick = () => player.skip(-15);
    document.getElementById('skipFwdBtn').onclick = () => player.skip(15);
    speedBtn.onclick = () => {
      const sp = player.cycleSpeed();
      speedBtn.textContent = sp.toFixed(1) + 'x';
    };

    // Scrub bar click/drag
    progressWrap.addEventListener('click', (e) => {
      const rect = progressWrap.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (player.audio.duration) {
        player.seek(pos * player.audio.duration);
      }
    });

    // Search filter
    const searchInput = document.getElementById('trackSearch');
    const clearBtn = document.getElementById('trackClear');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      clearBtn.classList.toggle('visible', q.length > 0);

      filteredTracks = tracks.filter(t => t.title.toLowerCase().includes(q));
      renderList(filteredTracks);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('visible');
      filteredTracks = [...tracks];
      renderList(filteredTracks);
      searchInput.focus();
    });

    loadTracks();
  </script>
</body>
</html>
